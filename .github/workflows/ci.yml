name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SESSION_SECRET: ci-random-secret-do-not-use-in-production
  DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/collabpro

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: collabpro
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push
      - run: npm run build
      - name: 📦 Upload build output for reuse by the E2E job
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.run_id }}
          path: .next
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: collabpro
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push
      - run: npm run test:coverage

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    outputs:
      playwright_outcome: ${{ steps.playwright_tests.outcome }}
      video_id: ${{ steps.upload_youtube.outputs.video_id }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: collabpro
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push
      # Reuse the build job's compiled output instead of rebuilding from
      # scratch - `needs: build` used to only gate ordering while this job
      # ran `npm run build` again itself, paying the full Next.js compile
      # twice per run for no reason.
      - name: 📦 Download build output from the build job
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build-${{ github.run_id }}
          path: .next
      # 6. Setup Playwright browsers & dependencies
      - name: 🎭 Setup Playwright browsers
        run: npx playwright install --with-deps chromium

      # 7. Execute the functional E2E suite (everything except the cinematic
      # showcase recording, which is gated separately below - it's a slow,
      # scripted marketing walkthrough, not a correctness check).
      - name: 🎬 Run Comprehensive E2E Test Suite
        id: playwright_tests
        env:
          DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/collabpro
        run: |
          shopt -s extglob
          npx playwright test tests/!(showcase).spec.ts

      # 7b. Cinematic showcase recording + YouTube upload - off by default.
      # Set the repo/org Actions variable ENABLE_SHOWCASE_VIDEO to "true"
      # (Settings > Secrets and variables > Actions > Variables) to turn it
      # back on; no workflow edit needed either way.
      - name: 🎥 Run Cinematic Showcase Recording
        id: showcase_recording
        if: vars.ENABLE_SHOWCASE_VIDEO == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/collabpro
        run: npm run test:showcase

      # 8. Upload showcase.webm video as safe GitHub workflow artifact
      - name: 💾 Archive Showcase Video Artifact
        if: vars.ENABLE_SHOWCASE_VIDEO == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: collabpro-cinematic-video
          path: test-results/showcase.webm
          retention-days: 7

      # 9. Upload E2E Cinematic Tour Video to YouTube (Robust Google APIs Script)
      - name: 🎥 Upload Cinematic Tour Video to YouTube
        id: upload_youtube
        if: vars.ENABLE_SHOWCASE_VIDEO == 'true' && success()
        continue-on-error: true # Continues gracefully if credentials or refresh tokens are not set up yet
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/upload-youtube.js

  # Split out of the E2E job: none of this needs Postgres or Playwright - it's
  # security scanning + reporting. Runs Snyk and SonarCloud directly against
  # this exact commit (previously this job just fired a webhook at the
  # production app, which queued an async `workflow_dispatch` of a separate
  # security-scan.yml - a second GitHub Actions run, on its own schedule, that
  # the email never actually waited for or read results from. The email's
  # Snyk/Sonar sections were reading stale/placeholder data every single time
  # as a result: parseSnykInsights() looked for a snyk_report.json that this
  # job never produced, and getSonarInsights() queried SonarCloud's
  # project-wide cached status with no link to this run's analysis at all).
  # `if: always()` so this still runs and reports even when e2e itself failed.
  notify:
    name: Notify & Security Scan
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud needs full history for accurate new-code analysis
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 🛡️ Run Snyk Security Scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npx snyk test --json --severity-threshold=high --org=${{ secrets.SNYK_ORG_ID }} > snyk_report.json || true

      - name: 📡 Run SonarCloud Static Code Check
        uses: SonarSource/sonarcloud-github-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Parse Discovered Insights from Sonar and Snyk - reads snyk_report.json
      # and .scannerwork/report-task.txt produced by the two steps above, both
      # scoped to this exact run.
      - name: 🔍 Parse Discovered Scan Insights
        id: parse_insights
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node scripts/parse-insights.js

      # Render the CI summary email from .github/ci-email-template.html -
      # the static markup lives in that file; this step only resolves the
      # handful of dynamic values (job/step outcomes aren't visible inside a
      # separately-loaded template file, so they're computed here and handed
      # to the renderer as plain env vars).
      - name: 🧩 Render CI Summary Email
        id: render_email
        env:
          JOB_STATUS: ${{ needs.e2e.result }}
          STATUS_BG: ${{ needs.e2e.result == 'success' && '#ecfdf5' || '#fef2f2' }}
          STATUS_BORDER: ${{ needs.e2e.result == 'success' && '#a7f3d0' || '#fecaca' }}
          STATUS_COLOR: ${{ needs.e2e.result == 'success' && '#047857' || '#b91c1c' }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          PLAYWRIGHT_COLOR: ${{ needs.e2e.outputs.playwright_outcome == 'success' && '#047857' || '#b91c1c' }}
          PLAYWRIGHT_TEXT: ${{ needs.e2e.outputs.playwright_outcome == 'success' && 'Passed' || 'Failed' }}
          VIDEO_SECTION_HTML: >-
            ${{ needs.e2e.outputs.video_id != '' && format('<!--[if mso]><table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" bgcolor="#dc2626" style="border-radius:6px;padding:10px 24px;"><a href="https://youtu.be/{0}" target="_blank" style="font-size:12px;font-weight:800;font-family:sans-serif;color:#ffffff;text-decoration:none;text-transform:uppercase;letter-spacing:0.06em;">Stream Walkthrough</a></td></tr></table><![endif]--><!--[if !mso]><!--><a href="https://youtu.be/{0}" target="_blank" style="display:inline-block;background-color:#dc2626;color:#ffffff;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;text-decoration:none;padding:10px 24px;border-radius:6px;">Stream Walkthrough</a><!--<![endif]-->', needs.e2e.outputs.video_id) || '<div style="color:#9ca3af;font-size:11px;font-weight:700;padding:12px 16px;border:1px dashed #374151;border-radius:6px;">Showcase recording is currently disabled in CI (set the ENABLE_SHOWCASE_VIDEO Actions variable to true to turn it back on).</div>' }}
          SONAR_INSIGHTS: ${{ steps.parse_insights.outputs.sonar_insights }}
          SNYK_INSIGHTS: ${{ steps.parse_insights.outputs.snyk_insights }}
        run: node scripts/render-ci-email.js

      # Send well-formatted testing summary email to user
      - name: ✉️ Send Testing Evidence Summary Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          secure: true
          subject: "CollabPro CI: ${{ github.ref_name }} ${{ needs.e2e.result }} — Run #${{ github.run_id }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "CollabPro CI/CD <ci-reports@collabpro.com>"
          html_body: ${{ steps.render_email.outputs.html }}
